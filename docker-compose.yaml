name: bionicpro

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-5Cs1gJrws6ndzPu7mfpmkXbipcIlHlij3u_4wuQtLyQ=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow-local-password}@airflow_db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET:-bionicpro-airflow-local-secret}
    AIRFLOW_CONN_CRM_DB: postgresql://crm_user:${CRM_DB_PASSWORD:-crm-local-password}@crm_db:5432/crm_db
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_DATABASE: bionicpro
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow_db:
      condition: service_healthy
    crm_db:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  networks:
    - bionicpro

services:
  keycloak_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-password}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - bionicpro

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-password}
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - bionicpro

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - bionicpro

  crm_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-crm-local-password}
    volumes:
      - ./crm-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5444:5432"
    networks:
      - bionicpro

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - bionicpro

  airflow_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local-password}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - bionicpro

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username admin
        --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        --firstname BionicPRO
        --lastname Admin
        --role Admin
        --email admin@bionicpro.local || airflow users list)
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    environment:
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OIDC_PUBLIC_URL: http://localhost:8080
      OIDC_INTERNAL_URL: http://keycloak:8080
      OIDC_REALM: reports-realm
      OIDC_CLIENT_ID: reports-bff
      OIDC_CLIENT_SECRET: bionicpro-local-secret-change-me
      OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: bionicpro
      MAX_REPORT_DAYS: "31"
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - bionicpro

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bionicpro

volumes:
  airflow_db_data:
  airflow_logs:
  clickhouse_data:
  crm_db_data:
  keycloak_db_data:

networks:
  bionicpro:
